[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phonectl"
version = "0.1.0"
description = "Android computer-use bridge over ADB (no root)"
requires-python = ">=3.9"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
yaml = ["PyYAML>=6"]

[project.scripts]
phonectl = "phonectl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "device: real-device benchmark lane (needs hardware over Wireless Debugging); never run in CI",
]
