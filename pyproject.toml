[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phonectl"
version = "0.1.0"
description = "Android computer-use bridge over ADB (no root)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jeremy McCoy" }]
keywords = ["android", "adb", "automation", "agent", "computer-use", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Android",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jumbodaddystack/phonectl"
Repository = "https://github.com/jumbodaddystack/phonectl"
Issues = "https://github.com/jumbodaddystack/phonectl/issues"

[project.optional-dependencies]
# The FastMCP transport imports `mcp.server.fastmcp`, which SDK 2.0 removed.
# Every published `mcp` release now requires Python >= 3.10, so without this marker
# `pip install ".[mcp]"` fails outright on 3.9 — taking the whole install down rather
# than just the optional transport. With it, 3.9 installs the (stdlib-only) core and
# the MCP frontend is simply unavailable there; `phonectl mcp` reports that, and the
# mcp-gated test skips.
mcp = ["mcp>=1.0,<2; python_version >= '3.10'"]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7"]

[project.scripts]
phonectl = "phonectl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "device: real-device benchmark lane (needs hardware over Wireless Debugging); never run in CI",
]
